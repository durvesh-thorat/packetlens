<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="packetlens-token" content="">
  <meta name="color-scheme" content="light dark">
  <title>PacketLens | Operations</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="PacketLens overview">
        <span class="brand-mark" aria-hidden="true">PL</span>
        <span>PacketLens</span>
      </a>
      <nav class="nav">
        <a href="#/overview" data-route="/overview">Overview</a>
        <a href="#/incidents" data-route="/incidents">Incidents</a>
        <a href="#/hosts" data-route="/hosts">Hosts</a>
        <a href="#/quality" data-route="/quality">Detection quality</a>
        <a href="#/policies" data-route="/policies">Policies</a>
      </nav>
      <p class="rail-foot">LOCAL MONITORING<br><span>Loopback service</span></p>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="capture-label">
          <span class="eyebrow">CAPTURE SOURCE</span>
          <strong id="source-name">Connecting</strong>
        </div>
        <div class="topbar-tools">
          <div class="clock">
            <span class="eyebrow">PACKET TIME</span>
            <time id="packet-clock">—</time>
          </div>
          <div class="health-indicator" id="health-indicator" role="status" aria-live="polite">
            <span class="status-mark" aria-hidden="true"></span>
            <span id="health-label">Connecting</span>
          </div>
          <button type="button" class="quiet-button" id="time-toggle" aria-pressed="true">UTC</button>
          <button type="button" class="quiet-button" id="theme-toggle" aria-pressed="false">Dark theme</button>
        </div>
      </header>

      <div class="stale-banner" id="stale-banner" role="alert" hidden>
        Server unavailable. Displayed values may be stale.
      </div>
      <div class="live-region" id="incident-announcer" aria-live="polite" aria-atomic="true"></div>
      <main id="view" tabindex="-1" aria-live="off"></main>
      <footer class="footer">PacketLens <span id="version"></span> · Technical operations console</footer>
    </div>
  </div>
</body>
</html>
