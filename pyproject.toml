[project]
name = "packetlens"
version = "0.1.0"
description = "Network traffic analyzer built from scratch: byte-level parsing, attack detection, live dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn", "numpy", "pandas"]

[project.scripts]
packetlens = "packetlens.cli:main"

[tool.setuptools.packages.find]
include = ["packetlens*"]

[tool.setuptools.package-data]
packetlens = ["static/*.html"]
