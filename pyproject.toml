[project]
name = "packetlens"
version = "0.1.0"
description = "Network traffic analyzer built from scratch: byte-level parsing, attack detection, live dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn", "numpy", "pandas"]
granite = [
    "torch",
    "granite-tsfm @ git+https://github.com/ibm-granite/granite-tsfm.git@v0.2.22",
    "datasets<4",
    "pyarrow<20",
    "transformers==4.48.3",
    "huggingface-hub<1",
]

[project.scripts]
packetlens = "packetlens.cli:main"

[tool.setuptools.packages.find]
include = ["packetlens*"]

[tool.setuptools.package-data]
packetlens = ["static/*.html", "static/*.js", "static/*.css", "policies/*.json"]
